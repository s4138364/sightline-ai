<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Sightline AI – Day 31</title>
</head>
<body>

<h2>Image Tag Matcher</h2>

<input type="file" id="imageInput" />
<br><br>

<input type="text" id="tagsInput" placeholder="cat, animal, dog" />
<br><br>

<button onclick="analyze()">Analyze</button>

<pre id="output"></pre>

<div id="feedback" style="display:none;">
    <p>Was this correct?</p>
    <button onclick="sendFeedback(true)">👍 Yes</button>
    <button onclick="sendFeedback(false)">👎 No</button>
</div>

<script>
let lastResult = null;

async function analyze() {
    const image = document.getElementById("imageInput").files[0];
    const tags = document.getElementById("tagsInput").value;

    const formData = new FormData();
    formData.append("image", image);
    formData.append("tags", tags);

    const response = await fetch("http://127.0.0.1:8000/analyze", {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    lastResult = data;

    document.getElementById("output").textContent =
        JSON.stringify(data, null, 2);

    document.getElementById("feedback").style.display = "block";
}

async function sendFeedback(correct) {
    await fetch("http://127.0.0.1:8000/feedback", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            ...lastResult,
            correct: correct
        })
    });

    alert("Thanks for the feedback!");
    document.getElementById("feedback").style.display = "none";
}
</script>

</body>
</html>
