<!DOCTYPE html>
<html>
<head>
    <title>Sightline AI</title>
</head>
<body>
    <h1>Sightline AI</h1>

    <input id="imageInput" type="file" />
    <br><br>

    <input id="userInput" type="text" placeholder="cat, dog, car" />
    <br><br>

    <button id="sendBtn">Analyze</button>

    <pre id="output">Waiting for input...</pre>

    <script>
        const button = document.getElementById("sendBtn");
        const output = document.getElementById("output");

        button.addEventListener("click", async () => {
            const tags = document.getElementById("userInput").value;
            const imageInput = document.getElementById("imageInput");

            if (!imageInput.files.length) {
                alert("Please select an image");
                return;
            }

            const formData = new FormData();
            formData.append("image", imageInput.files[0]);
            formData.append("tags", tags);

            const response = await fetch("http://127.0.0.1:8000/analyze", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            output.textContent = `
            Score: ${data.score}

            Explanation:
            ${data.explanation.join("\n")}

            Detected Labels:
            ${data.detected_labels.map(l => `${l.label} (${(l.confidence * 100).toFixed(1)}%)`).join("\n")}
            `;
        });
    </script>
</body>
</html>
