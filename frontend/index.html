<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sightline AI</title>
</head>
<body>
    <h1>Sightline AI</h1>

    <input
        id="userInput"
        type="text"
        placeholder="Enter tags (comma separated)"
    />

    <br><br>

    <input
        id="imageInput"
        type="file"
        accept="image/*"
    />

    <br><br>

    <button id="sendBtn">Analyze</button>

    <pre id="output">Waiting for input...</pre>

    <script>
        const button = document.getElementById("sendBtn");
        const output = document.getElementById("output");

        button.addEventListener("click", async () => {
            const tagsRaw = document.getElementById("userInput").value;
            const imageInput = document.getElementById("imageInput");
            const imageFile = imageInput.files[0];

            if (!imageFile) {
                output.textContent = "Please select an image.";
                return;
            }

            const formData = new FormData();
            formData.append("image", imageFile);
            formData.append("tags", tagsRaw);

            try {
                const response = await fetch("http://127.0.0.1:8000/analyze", {
                    method: "POST",
                    body: formData
                });

                // NEW ERROR HANDLING - Check if response is OK
                if (!response.ok) {
                    const errorData = await response.json();
                    output.textContent = "Error: " + errorData.detail;
                    return;
                }

                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Request failed: " + err;
            }
        });
    </script>
</body>
</html>
